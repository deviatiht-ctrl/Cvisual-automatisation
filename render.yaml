        value: "360000"
      - key: MAX_REMINDERS_PER_DAY
        value: "25"
      - key: BATCH_PAUSE_EVERY_N
        value: "5"
      - key: BATCH_PAUSE_MS
        value: "600000"
      - key: AUTH_DATA_DIR
        value: /app/.wwebjs_auth
